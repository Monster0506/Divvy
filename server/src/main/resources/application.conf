ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.monster0506.divvy.server.ApplicationKt.module ]
    }
}

divvy {
    version = "1.0"
    version = ${?APP_VERSION}
    database {
        url = ${?DATABASE_URL}
        user = ${?DATABASE_USER}
        password = ${?DATABASE_PASSWORD}
        poolSize = ${?DATABASE_POOL_SIZE}
    }
    ml {
        url = ${?ML_SERVICE_URL}
    }
    apiKey = ${?API_KEY}
    images {
        dir = ${?IMAGE_DIR}
        maxUploadBytes = ${?MAX_UPLOAD_BYTES}
    }
}
