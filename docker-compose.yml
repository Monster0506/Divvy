name: divvy

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M

  ml:
    build:
      context: ./ml
    restart: unless-stopped
    volumes:
      - mldata:/data
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ml:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      ML_SERVICE_URL: http://ml:8000
      API_KEY: ${API_KEY:?set API_KEY in .env}
      IMAGE_DIR: /data/receipts
    ports:
        - "8080:8080"
    volumes:
      - receipts:/data/receipts
    networks: [internal, edge]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M

networks:
  internal:
    internal: true   # no outside access; ml and db are unreachable from the host
  edge: {}

volumes:
  pgdata:
  receipts:
  mldata: