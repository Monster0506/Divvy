[project]
name = "divvy-ml"
version = "0.1.0"
description = "Divvy ML service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "httpx>=0.27",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3"]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["divvy_ml*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
