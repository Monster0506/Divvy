# Production overlay: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Adds Caddy for HTTPS and keeps the server off the public interface.
services:
  server:
    ports: !override
      - "127.0.0.1:8080:8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      DIVVY_DOMAIN: ${DIVVY_DOMAIN:?set DIVVY_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]

volumes:
  caddy_data:
  caddy_config:
