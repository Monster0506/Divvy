name: ML service

on:
  push:
    branches: [main]
    paths:
      - "ml/**"
      - ".github/workflows/ml.yml"
  pull_request:
    paths:
      - "ml/**"
      - ".github/workflows/ml.yml"
  workflow_dispatch:

concurrency:
  group: ml-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: ml

jobs:
  lint-test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format
        run: ruff format --check .

      - name: Pytest
        run: pytest

      - name: Evaluate on the synthetic household
        run: python -m divvy_ml.eval --household synthetic --size 1500 --min-exact 0.8 --out eval-report

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: ownership-evaluation
          path: ml/eval-report

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t divvy-ml:ci .

      - name: Serve /health
        run: |
          docker run -d --name divvy-ml -p 8000:8000 divvy-ml:ci
          for _ in $(seq 1 30); do
            if curl -sf localhost:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs divvy-ml
          exit 1
