name: Server tests

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "server/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/server-tests.yml"

concurrency:
  group: server-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Migrations and repository tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Testcontainers uses the runner's Docker daemon to start pgvector/pgvector:pg16.
      - name: Run server tests
        run: ./gradlew :server:test --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-report
          path: server/build/reports/tests/test